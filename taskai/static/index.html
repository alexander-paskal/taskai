<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>taskai</title>
	<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
	<canvas id="myCanvas"></canvas>

	<div id="edit-panel" class="edit-panel">
		<button id="edit-toggle" class="edit-toggle" aria-label="Toggle edit panel" aria-expanded="false">
			<svg width="14" height="16" viewBox="0 0 14 16" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M8 1L1 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M14 1L7 8L14 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
			</svg>
		</button>
		<div class="edit-body"></div>
	</div>

	<div id="console-panel" class="console-panel">
		<button id="console-toggle" class="console-toggle" aria-label="Toggle console" aria-expanded="false">
			<svg width="16" height="14" viewBox="0 0 16 14" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M1 6L8 1L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M1 12L8 7L15 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
			</svg>
		</button>
		<div class="console-body">
			<div id="console-scrollback" class="console-scrollback"></div>
			<input id="console-input" class="console-input" type="text" placeholder="Type a command…" autocomplete="off" />
		</div>
	</div>

	<script src="/static/canvas.js"></script>
	<script src="/static/editpanel.js"></script>
	<script src="/static/console.js"></script>
</body>
</html>
