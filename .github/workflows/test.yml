name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests
        run: python -m pytest -q

  docs:
    name: docs (build + linkcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt
      # -W: warnings fail the build - this currently includes the known
      # docs/_static/demo.gif placeholder (see PHASE_1_RELEASE.md), so this
      # job is red until that's swapped for a real recording. Intentional:
      # a known, tracked gap is exactly what this check should catch.
      - name: Build docs (warnings as errors)
        run: sphinx-build -b html -W docs docs/_build/html
      - name: Check external links
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
